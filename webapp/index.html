<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="مفيد - مدرس ذكي يعمل بدون إنترنت، إجاباته من منهجك أنت">
<title>مفيد</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app" data-mode="landing">

  <div class="scene" aria-hidden="true">
    <span class="glow"></span>
    <svg class="horizon" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax meet">
      <defs>
        <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="currentColor" stop-opacity="0"/>
          <stop offset="50%" stop-color="currentColor" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="currentColor" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="moonGlow">
          <stop offset="0%" stop-color="currentColor" stop-opacity="0.45"/>
          <stop offset="100%" stop-color="currentColor" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="currentColor" stop-opacity="0"/>
          <stop offset="100%" stop-color="currentColor" stop-opacity="0.5"/>
        </linearGradient>
      </defs>

      <circle class="moon-glow" cx="1036" cy="62" r="44"/>
      <circle class="moon" cx="1036" cy="62" r="13"/>

      <rect class="haze" x="0" y="196" width="1200" height="58"/>

      <path class="dune far" d="M0 248 C 190 236 330 244 500 232 C 668 220 800 240 950 230 C 1064 223 1140 234 1200 228 L1200 300 L0 300 Z"/>

      <path class="dune near" d="M0 266 C 150 258 292 270 462 259 C 632 248 772 268 926 257 C 1048 248 1132 262 1200 254 L1200 300 L0 300 Z"/>

      <path class="ripple" d="M96 278 c58-6 108-3 156 2"/>
      <path class="ripple" d="M320 288 c74-7 138-4 196 3"/>
      <path class="ripple" d="M640 282 c66-6 122-3 172 2"/>
      <path class="ripple" d="M900 292 c58-5 108-2 152 3"/>

      <g class="palms">
        <path class="trunk" d="M1046 262 c3-24 4-42 2-58"/>
        <path class="frond" d="M1048 204 c-24-16-44-14-56-3"/>
        <path class="frond" d="M1048 204 c24-16 44-14 56-3"/>
        <path class="frond" d="M1048 202 c-16-21-33-28-46-26"/>
        <path class="frond" d="M1048 202 c16-21 33-28 46-26"/>
        <path class="frond" d="M1048 203 c-5-24-2-36 4-44"/>
        <path class="trunk" d="M1122 264 c2-18 2-30 1-41"/>
        <path class="frond" d="M1123 223 c-18-12-33-11-42-3"/>
        <path class="frond" d="M1123 223 c18-12 33-11 42-3"/>
        <path class="frond" d="M1123 222 c-11-16-24-21-34-20"/>
        <path class="frond" d="M1123 222 c11-16 24-21 34-20"/>
      </g>

      <path class="sweep" d="M0 266 C 150 258 292 270 462 259 C 632 248 772 268 926 257 C 1048 248 1132 262 1200 254"/>
    </svg>
  </div>

  <header class="top">
    <div class="brand">
      <svg class="mark intro" viewBox="22 14 43 70" aria-hidden="true" data-mark></svg>
      <h1>MOFID</h1>
    </div>
    <span class="spacer"></span>

    <button class="context" id="context" type="button" aria-live="polite">
      <svg class="context-mark" viewBox="22 14 43 70" aria-hidden="true" data-mark></svg>
      <span class="context-text" id="contextText"></span>
    </button>

    <span class="pill" id="status" data-state="offline">
      <span class="dot"></span><span id="statusText">جارٍ التحقق…</span>
    </span>
    <button class="ctrl" id="newChat" type="button" aria-label="محادثة جديدة" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </button>
    <button class="ctrl" id="lang" type="button" title="English">EN</button>
    <button class="ctrl" id="theme" type="button" aria-label="تبديل الوضع الليلي">◐</button>
    <div class="progress" aria-hidden="true"><i></i></div>
  </header>

  <main class="scroll" id="scroll">
    <div class="col">

      <section class="hero" id="hero">
        <svg class="mark lg intro" viewBox="22 14 43 70" aria-hidden="true" data-mark></svg>
        <h2 data-i18n="heroTitle">اسأل عن أي موضوع في منهجك</h2>
        <p data-i18n="heroSub">كل إجابة مأخوذة من كتاب المنهج، ويظهر أسفلها الفصل والدرس. وإذا كان السؤال خارج المنهج، يوضّح مفيد ذلك.</p>
        <div class="picker" id="picker" hidden>
          <button class="pick-back" id="pickBack" type="button" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 6l-6 6 6 6"/>
            </svg>
            <span id="pickBackText"></span>
          </button>
          <div class="cards" id="cards"></div>
        </div>
        <div class="chips" id="chips"></div>
      </section>

      <div id="thread" aria-live="polite"></div>

    </div>
    <button class="to-bottom" id="toBottom" type="button" aria-label="الانتقال إلى آخر المحادثة" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 5v14M6 13l6 6 6-6"/>
      </svg>
    </button>
  </main>

  <div class="dock">
    <form class="composer" id="composer">
      <textarea id="input" rows="1" enterkeyhint="send"
        placeholder="اكتب سؤالك…" data-i18n-ph="placeholder" autocomplete="off"></textarea>
      <button class="send" id="send" type="submit" disabled aria-label="إرسال">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </button>
    </form>

    <p class="foot" id="foot" data-i18n="foot">مفيد يعمل دون إنترنت · الإجابات من كتاب المنهج</p>
  </div>

</div>

<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
