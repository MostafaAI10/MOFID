<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="مفيد - مدرس ذكي يعمل بدون إنترنت، إجاباته من منهجك أنت">
<title>مفيد</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app" data-mode="landing">

  <header class="top">
    <div class="brand">
      <svg class="mark intro" viewBox="22 14 43 70" aria-hidden="true">
        <path class="s1" d="M22.5,28.5 L40.0,20.0 L40.0,74.5 L22.5,83.0 Z"/>
        <path class="s2" d="M34.3,25.8 L51.8,17.3 L51.8,71.8 L34.3,80.3 Z"/>
        <path class="s3" d="M46.1,23.1 L63.6,14.6 L63.6,69.1 L46.1,77.6 Z"/>
      </svg>
      <h1>MOFID</h1>
    </div>
    <span class="spacer"></span>
    <span class="pill" id="status" data-state="offline">
      <span class="dot"></span><span id="statusText">جارٍ التحقق…</span>
    </span>
    <button class="ctrl" id="lang" type="button" title="English">EN</button>
    <button class="ctrl" id="theme" type="button" aria-label="تبديل الوضع الليلي">◐</button>
  </header>

  <main class="scroll" id="scroll">
    <div class="col">

      <section class="hero" id="hero">
        <svg class="mark lg intro" viewBox="22 14 43 70" aria-hidden="true">
        <path class="s1" d="M22.5,28.5 L40.0,20.0 L40.0,74.5 L22.5,83.0 Z"/>
        <path class="s2" d="M34.3,25.8 L51.8,17.3 L51.8,71.8 L34.3,80.3 Z"/>
        <path class="s3" d="M46.1,23.1 L63.6,14.6 L63.6,69.1 L46.1,77.6 Z"/>
      </svg>
        <h2 data-i18n="heroTitle">اسأل عن أي حاجة في منهجك</h2>
        <p data-i18n="heroSub">كل إجابة بترجع من كتاب المنهج نفسه، وهتلاقي تحتها الفصل والدرس
          اللي جات منه. ولو السؤال مش في منهجك، هقولك بصراحة.</p>
        <div class="chips" id="chips"></div>
      </section>

      <div id="thread" aria-live="polite"></div>

    </div>
  </main>

  <div class="dock">
    <form class="composer" id="composer">
      <textarea id="input" rows="1" enterkeyhint="send"
        placeholder="اكتب سؤالك…" data-i18n-ph="placeholder" autocomplete="off"></textarea>
      <button class="send" id="send" type="submit" disabled aria-label="إرسال">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </button>
    </form>
    <p class="foot" id="foot" data-i18n="foot">مفيد بيشتغل من غير إنترنت · الإجابات من منهج الفيزياء للصف الثالث الثانوي</p>
  </div>

</div>

<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
